<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kota Yasasvi Surya Vignesh — Aerospace Engineering portfolio covering rocket propulsion, high-speed CFD, aerostructures, UAV integration, and space mission design.">
  <title>Kota Yasasvi Surya Vignesh | Aerospace Engineering Portfolio</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121824;
      --surface-accent: #1a2234;
      --line: #222f44;
      --line-subtle: #192335;
      --ink: #e2e8f0;
      --ink-bright: #ffffff;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.12);
      --font-body: "Times New Roman", Times, Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 17.5px;
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      text-underline-offset: 3px;
      transition: color 0.15s ease;
    }
    a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    .wrap {
      width: min(1080px, 92%);
      margin: auto;
    }

    /* HEADER & NAV */
    header {
      border-bottom: 1px solid var(--line);
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 14px 0;
      flex-wrap: wrap;
    }
    .brand {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-bright);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
    }
    nav a {
      color: var(--muted);
    }
    nav a:hover {
      color: var(--ink-bright);
      text-decoration: none;
    }

    /* HERO SECTION */
    .hero {
      padding: 68px 0 52px;
      border-bottom: 1px solid var(--line);
      background: radial-gradient(circle at 85% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 60%);
    }
    .kicker {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(34px, 5.5vw, 56px);
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--ink-bright);
      margin: 0 0 16px;
      max-width: 850px;
    }
    .lead {
      font-size: 20px;
      color: #cbd5e1;
      max-width: 820px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 26px;
    }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid var(--accent);
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn.primary {
      background: var(--accent);
      color: #070d18;
    }
    .btn.primary:hover {
      background: #7dd3fc;
      text-decoration: none;
    }
    .btn.secondary {
      background: transparent;
      color: var(--ink-bright);
      border-color: var(--line);
    }
    .btn.secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      text-decoration: none;
    }

    /* DOMAINS GRID */
    .domains {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 36px;
    }
    .domain {
      background: var(--card-bg);
      border: 1px solid var(--line);
      padding: 16px 18px;
      border-radius: 5px;
    }
    .domain strong {
      display: block;
      font-family: var(--font-sans);
      font-size: 15px;
      color: var(--ink-bright);
      margin-bottom: 4px;
    }
    .domain span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      display: block;
    }

    /* SECTIONS */
    section {
      padding: 56px 0;
      border-bottom: 1px solid var(--line);
    }
    .section-head {
      margin-bottom: 30px;
    }
    .eyebrow {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h2 {
      font-size: 32px;
      color: var(--ink-bright);
      margin: 6px 0 4px;
      line-height: 1.15;
    }
    h3 {
      font-size: 21px;
      color: var(--ink-bright);
      line-height: 1.25;
      margin: 0 0 10px;
    }
    .sub {
      color: var(--muted);
      margin-top: 4px;
      font-size: 16px;
    }
